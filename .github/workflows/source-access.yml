name: Investor source accessibility audit (75 categories)
on:
  workflow_dispatch:
  push:
    paths:
      - source_access.py
      - source_overrides.json
      - .github/workflows/source-access.yml
permissions:
  contents: write
concurrency:
  group: investor-access-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source readers and Chromium
        run: |
          python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml playwright
          python -m playwright install --with-deps chromium
      - name: Check syntax and mapping integrity
        run: |
          python -m py_compile source_access.py
          python - <<'PY'
          import json
          data = json.load(open("source_overrides.json"))["sources"]
          assert len(data) == 75
          assert len(set(k.split("|")[0] for k in data)) == 25
          assert all(v for v in data.values())
          print("75/75 categories have at least one configured URL.")
          PY
      - name: Attempt every configured URL; render JavaScript-thin pages
        id: audit
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python source_access.py --browser --timeout 12 --retries 2
      - name: Preserve complete report even when sources restrict access
        if: always()
        run: |
          if [ -d source-probes ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add source-probes/*-access.json
            if ! git diff --cached --quiet; then
              git commit -m "Record issuer URL access audit"
              git push
            fi
          fi
      - name: Fail if any category remains inaccessible
        if: steps.audit.outcome != 'success'
        run: |
          echo "Source access is incomplete. Examine source-probes/YYYY-MM-DD-access.json" >&2
          exit 1
