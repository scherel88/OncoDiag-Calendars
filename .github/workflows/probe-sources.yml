name: Probe all 78 investor source categories

on:
  push:
    paths:
      - "source_probe.py"
      - "source_browser_probe.py"
      - "source_overrides.json"
      - ".github/workflows/probe-sources.yml"
  workflow_dispatch:
  schedule:
    # GitHub schedules are UTC; these two slots cover 08:00 Eastern in DST and standard time.
    - cron: "0 12 * * *"
    - cron: "0 13 * * *"

permissions:
  contents: write

concurrency:
  group: investor-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check local schedule window
        id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=America/New_York date +%H)" != "08" ]]; then
            echo "run_probe=false" >> "$GITHUB_OUTPUT"
            echo "Skipping second UTC slot outside 08:00 Eastern"
          else
            echo "run_probe=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.schedule.outputs.run_probe == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.schedule.outputs.run_probe == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Attempt all 78 primary-source categories with fallbacks
        if: steps.schedule.outputs.run_probe == 'true'
        run: python source_probe.py

      - name: Determine browser fallback need
        id: fallback
        if: steps.schedule.outputs.run_probe == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = max(Path("source-probes").glob("????-??-??.json"))
          d = json.loads(p.read_text())
          required = d.get("http_failed", 0) > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("required=" + ("true" if required else "false") + "\n")
          print(f"HTTP-blocked source categories: {d.get('http_failed', 0)}")
          PY

      - name: Install ordinary public browser for blocked official pages
        if: steps.fallback.outputs.required == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium

      - name: Render blocked source pages without bypassing access controls
        if: steps.fallback.outputs.required == 'true'
        run: python source_browser_probe.py

      - name: Publish diagnostic summary
        if: steps.schedule.outputs.run_probe == 'true'
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = max(Path("source-probes").glob("????-??-??.json"))
          data = json.loads(p.read_text())
          summary = (
              "## Investor-source HTTP preflight (not a complete 78-source content audit)\n"
              f"- URL categories attempted: **{data['url_attempted']}/78**\n"
              f"- Successfully fetched: **{data['http_fetched']}/78**\n"
              f"- Failed all fallback URLs: **{data['http_failed']}**\n"
              f"- Dated, category-specific content candidates: **{data.get('content_candidate_categories', 0)}/78**\n"
              f"- Browser review required (HTTP block or unusable content): **{data.get('browser_fallback_needed', 0)}**\n"
              f"- Sparse/dynamic content: **{data['sparse_dynamic_or_empty']}**\n"
              f"- Historical/single-document primary URLs: **{data['historical_one_off_sources']}**\n"
              "- No HTTP success is counted as a verified announcement review.\n"
          )
          browser = p.with_suffix(".browser.json")
          if browser.exists():
              b = json.loads(browser.read_text())
              summary += (f"- Browser-rendered previously blocked categories: **{b['browser_rendered_categories']}/{b['attempted_categories']}**\n"
                          "- Browser rendering does not establish complete announcement review.\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(summary)
          if data["http_failed"]:
              print("::warning::Some primary sources remain inaccessible; consult source-probes JSON")
          PY

      - name: Commit source probe evidence without rebase conflicts
        if: steps.schedule.outputs.run_probe == 'true'
        run: |
          git config user.name "diagnostics-earnings-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          report="$(find source-probes -maxdepth 1 -name '*.json' | sort | tail -n 1)"
          filename="$(basename "$report")"
          cp "$report" "$RUNNER_TEMP/probe-report.json"
          for attempt in 1 2 3 4; do
            # The daily evidence path can be written by overlapping push-triggered
            # runs. Never rebase two generated JSON reports against each other.
            git fetch origin "${GITHUB_REF_NAME}" || exit 1
            git reset --hard "origin/${GITHUB_REF_NAME}" || exit 1
            mkdir -p source-probes
            cp "$RUNNER_TEMP/probe-report.json" "source-probes/$filename"
            git add "source-probes/$filename"
            if git diff --cached --quiet; then
              echo "Latest upstream evidence is already identical"
              exit 0
            fi
            git commit -m "Record automated investor-source reachability preflight"
            if git push; then exit 0; fi
            echo "Concurrent upstream write; retrying generated evidence publication"
            sleep $((attempt * 3))
          done
          echo "Failed to publish source probe evidence after four retries" >&2
          exit 1
