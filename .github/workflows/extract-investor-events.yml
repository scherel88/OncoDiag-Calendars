name: Extract public investor-event candidates

# Scheduling must live on main; scripts, registry and extraction data live on
# earnings-financial-calls. This workflow never modifies canonical events/ICS.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/extract-investor-events.yml"
  schedule:
    # 07:05 America/New_York via DST-aware gate
    - cron: "5 11,12 * * *"

permissions:
  contents: write

concurrency:
  group: earnings-public-event-extraction
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Gate to 7 AM Eastern (or manual invocation)
        id: window
        run: |
          hour=$(TZ=America/New_York date +%H)
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || "$hour" == "07" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.window.outputs.run == 'true'
        with:
          ref: earnings-financial-calls
          persist-credentials: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: earnings/requirements-extraction.txt

      - name: Install Chromium and Python requirements
        if: steps.window.outputs.run == 'true'
        run: |
          python -m pip install -r earnings/requirements-extraction.txt
          python -m playwright install --with-deps chromium

      - name: Test parser and source roster
        if: steps.window.outputs.run == 'true'
        run: |
          python -m py_compile earnings/scripts/extract_public_events.py
          python -m unittest discover -s earnings/tests -p 'test_*.py' -v
          python earnings/scripts/extract_public_events.py --self-test

      - name: Scan 23 public issuer event pages
        if: steps.window.outputs.run == 'true'
        id: scan
        continue-on-error: true
        run: |
          run_day=$(TZ=America/New_York date +%F)
          mkdir -p earnings/extractions
          python earnings/scripts/extract_public_events.py \
            --config earnings/config/sources.json \
            --output "earnings/extractions/$run_day.json" \
            --concurrency 3 --max-details 10 --site-deadline 130

      - name: Preserve diagnostic artifact
        if: always() && steps.window.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: investor-event-candidates
          path: earnings/extractions/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Commit raw candidates only to earnings branch
        if: always() && steps.window.outputs.run == 'true'
        run: |
          set -euo pipefail
          if ! compgen -G "earnings/extractions/*.json" >/dev/null; then
            echo "No extraction report was produced" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earnings/extractions/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record unverified browser-extracted investor event candidates"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:earnings-financial-calls; then exit 0; fi
            git fetch origin earnings-financial-calls
            git rebase origin/earnings-financial-calls || {
              git rebase --abort || true
              echo "Conflicting updates; cannot safely rebase" >&2
              exit 1
            }
            sleep "$((attempt * 3))"
          done
          echo "Could not publish diagnostic report" >&2
          exit 1

      - name: Surface extraction-runtime failures
        if: steps.window.outputs.run == 'true' && steps.scan.outcome != 'success'
        run: |
          echo "Extraction process failed; inspect Actions artifact and diagnostics" >&2
          exit 1
